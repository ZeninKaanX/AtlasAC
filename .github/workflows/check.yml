name: Check and package AtlasAC native desktop
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libglib2.0-0t64 libfontconfig1 libfreetype6 libpulse0
      - run: python -m pip install -r requirements-build.txt
      - name: Check Qt imports before running tests
        run: python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtMultimedia import QSoundEffect"
      - run: python -m unittest discover -s tests -v
        timeout-minutes: 5
      - name: Validate real pinned ghost samples without execution
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'atlasac-ghost-validation'
          subprocess.run([sys.executable, 'tools/validate_ghost_samples.py', '--expansion-only', '--download', '--samples-dir', str(base), '--output', 'ghost-validation.json'], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghost-validation-${{ matrix.os }}
          path: ghost-validation.json
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name AtlasAC --icon atlasac/web/assets/atlasac.ico --add-data "atlasac/web/assets:atlasac/web/assets" --add-data "rules:rules" --add-data "corpus/results:corpus/results" run.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --noupx --name AtlasAC --distpath dist/Standalone --workpath build/Standalone --icon atlasac/web/assets/atlasac.ico --add-data "atlasac/web/assets:atlasac/web/assets" --add-data "rules:rules" --add-data "corpus/results:corpus/results" run.py
      - name: Validate frozen report verification and tamper rejection
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          binary = pathlib.Path('dist/Standalone') / ('AtlasAC.exe' if os.name == 'nt' else 'AtlasAC')
          subprocess.run([sys.executable, 'tools/verify_bundle.py', str(binary)], check=True)
          subprocess.run([sys.executable, 'tools/validate_report_receipt.py', str(binary)], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasAC-${{ matrix.os }}
          path: dist/AtlasAC/
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasAC-standalone-${{ matrix.os }}
          path: dist/Standalone/
