name: Check and package AtlasAC native desktop
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name AtlasAC --icon atlasac/web/assets/atlasac.ico --add-data "atlasac/web/assets:atlasac/web/assets" --add-data "rules:rules" --add-data "corpus/results:corpus/results" run.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --noupx --name AtlasAC --distpath dist/Standalone --workpath build/Standalone --icon atlasac/web/assets/atlasac.ico --add-data "atlasac/web/assets:atlasac/web/assets" --add-data "rules:rules" --add-data "corpus/results:corpus/results" run.py
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasAC-${{ matrix.os }}
          path: dist/AtlasAC/
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasAC-standalone-${{ matrix.os }}
          path: dist/Standalone/
